name: Daily Brief
on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Hit daily-brief endpoint
        run: |
          curl -fsSL -X POST "${{ secrets.AGENT_BASE_URL }}/cron/daily-brief" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30
