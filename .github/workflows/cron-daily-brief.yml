name: Daily Brief
on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Hit daily-brief endpoint
        env:
          AGENT_BASE_URL: ${{ secrets.AGENT_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${AGENT_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "AGENT_BASE_URL or CRON_SECRET repository secret is empty" >&2
            exit 1
          fi
          code=$(curl -sS -o /tmp/cron-body -w "%{http_code}" -X POST "${AGENT_BASE_URL%/}/cron/daily-brief" \
            --oauth2-bearer "${CRON_SECRET}" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 120)
          echo "HTTP ${code}"
          cat /tmp/cron-body
          echo
          test "${code}" = "200"
