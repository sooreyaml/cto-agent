name: Due and Watch
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  due:
    runs-on: ubuntu-latest
    steps:
      - name: Hit due endpoint
        env:
          AGENT_BASE_URL: ${{ secrets.AGENT_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${AGENT_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "AGENT_BASE_URL or CRON_SECRET repository secret is empty" >&2
            exit 1
          fi
          code=$(curl -sS -o /tmp/cron-body -w "%{http_code}" -X POST "${AGENT_BASE_URL%/}/cron/due" \
            --oauth2-bearer "${CRON_SECRET}" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --connect-timeout 10 \
            --max-time 45 \
            --retry 3 \
            --retry-delay 5 \
            --retry-max-time 180 \
            --retry-all-errors)
          echo "HTTP ${code}"
          cat /tmp/cron-body
          echo
          test "${code}" = "200"
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Hit watch endpoint
        env:
          AGENT_BASE_URL: ${{ secrets.AGENT_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${AGENT_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "AGENT_BASE_URL or CRON_SECRET repository secret is empty" >&2
            exit 1
          fi
          code=$(curl -sS -o /tmp/cron-body -w "%{http_code}" -X POST "${AGENT_BASE_URL%/}/cron/watch" \
            --oauth2-bearer "${CRON_SECRET}" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --connect-timeout 10 \
            --max-time 45 \
            --retry 3 \
            --retry-delay 5 \
            --retry-max-time 180 \
            --retry-all-errors)
          echo "HTTP ${code}"
          cat /tmp/cron-body
          echo
          test "${code}" = "200"
