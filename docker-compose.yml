services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cto}
      POSTGRES_DB: ${POSTGRES_DB:-cto_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cto} -d ${POSTGRES_DB:-cto_agent}",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - internal

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cto}:${POSTGRES_PASSWORD:-cto}@db:5432/${POSTGRES_DB:-cto_agent}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
