[project]
name = "cto-agent"
version = "0.1.0"
requires-python = ">=3.11"
description = "Slack DM CTO agent (FastAPI + OpenRouter + Postgres)"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
